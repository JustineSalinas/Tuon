name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Runs against every tracked file, not just the diff — the pre-commit
      # hook covers the diff, and this catches anything committed with
      # --no-verify or from a clone that never ran `npm install`.
      - name: Credential scan
        run: npm run check:secrets -- --all

      # `LayoutProps` and the rest of the typed-routes surface are generated
      # into `.next/types`, so they do not exist in a fresh clone. Typecheck
      # runs before Build, which is why every run on this workflow failed on a
      # type the framework was always going to write. `typegen` does that one
      # job without paying for a full build, and needs no environment.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm test

      - name: Security rules tests
        run: |
          npm i -g firebase-tools
          npm run test:rules

      # Build needs the public Firebase config present, but not real secrets:
      # these are public identifiers by design, and the placeholders below are
      # never used to reach a real project during a build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
